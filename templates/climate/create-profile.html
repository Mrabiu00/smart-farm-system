// ----- POPULATE STATES & CROPS -----
function populateStates() {
  const stateSelect = document.getElementById('state');
  stateSelect.innerHTML = `<option value="">${texts[lang].state}</option>`;
  nigeriaLGAs.forEach(state => {
    stateSelect.innerHTML += `<option value="${state.name}">${state.name}</option>`;
  });
}

document.getElementById('state').addEventListener('change', function(){
  const lgaSelect = document.getElementById('lga');
  lgaSelect.innerHTML = `<option value="">${texts[lang].lga}</option>`;
  const selected = nigeriaLGAs.find(s => s.name === this.value);
  if(selected){
    selected.lgas.forEach(lga => {
      lgaSelect.innerHTML += `<option value="${lga}">${lga}</option>`;
    });
  }
});

function populateCrops(){
  const cropSelect = document.getElementById('crop');
  cropSelect.innerHTML = `<option value="">${texts[lang].crop}</option>`;
  crops[lang].forEach(c => {
    cropSelect.innerHTML += `<option value="${c}">${c}</option>`;
  });
}

// ----- LANGUAGE TOGGLE -----
function setLang(l){
  lang = l;
  document.getElementById('title').innerText = texts[lang].title;
  document.getElementById('fullName').placeholder = texts[lang].fullName;
  document.getElementById('farmName').placeholder = texts[lang].farmName;
  document.getElementById('country').options[0].text = texts[lang].country;
  document.getElementById('state').options[0].text = texts[lang].state;
  document.getElementById('lga').options[0].text = texts[lang].lga;
  document.getElementById('farmSize').placeholder = texts[lang].farmSize;
  document.querySelector('button').innerText = texts[lang].button;
  populateStates();
  populateCrops();
}

// ----- SAVE PROFILE -----
function finish(){
    const profile = {
        fullName: document.getElementById('fullName').value,
        farmName: document.getElementById('farmName').value,
        country: document.getElementById('country').value,
        state: document.getElementById('state').value,
        lga: document.getElementById('lga').value,
        crop: document.getElementById('crop').value,
        farmSize: document.getElementById('farmSize').value
    };

    for(const key in profile){
        if(!profile[key]){
            alert(texts[lang].alertFill + key);
            return;
        }
    }

  // Save offline
  localStorage.setItem('profile', JSON.stringify(profile));

  // ----- FIREBASE LOGIC -----
  // Example: Save under userID
 // Save to Firebase
    const user = firebase.auth().currentUser;
    if(user){
        firebase.database().ref('users/' + user.uid + '/profile').set(profile)
            .then(() => {
                // Also mark profile as completed
                return firebase.database().ref('users/' + user.uid).update({
                    profileCompleted: true,
                    profileCompletedAt: firebase.database.ServerValue.TIMESTAMP
                });
            })
            .then(() => {
                alert(lang==='en' ? "Profile saved successfully!" : "An adana bayaninka cikin nasara!");
                window.location.href = "/dashboard/";  // ← Updated
            })
            .catch(err => {
                console.error(err);
                alert("Error saving profile. You can try again.");
            });
    } else {
        alert("Please login first");
        window.location.href = "/login/";
    }
}
