<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verify Email - SmartFarm</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
body{background:#f4f6f8;color:#9aa0a6;font-family:Poppins;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
.box{background:white;padding:28px;border-radius:18px;width:92%;max-width:420px;text-align:center}
button{margin-top:12px;width:100%;padding:14px;border:none;border-radius:14px;background:#7b61ff;color:#fff;font-weight:600;cursor:pointer}
button.secondary{background:#1c1c22}
p{color:#aaa;line-height:1.4}
.small{font-size:12px;color:#9aa0a6;margin-top:10px}
</style>
</head>
<body>

<div class="box">
  <h2>Verify Your Email</h2>
  <p id="status">Loading...</p>

  <button id="sendBtn">Send / Resend Verification Email</button>
  <button class="secondary" id="checkBtn">I Verified (Check Again)</button>
  <button class="secondary" id="logoutBtn">Logout</button>

  <div class="small">After clicking the email link, come back and press “Check Again”.</div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    sendEmailVerification,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCgXeXIybagT9q-riMCSzXsuY7xgoVKYtU",
    authDomain: "smart-farm00.firebaseapp.com",
    projectId: "smart-farm00",
    storageBucket: "smart-farm00.firebasestorage.app",
    messagingSenderId: "287777077332",
    appId: "1:287777077332:web:046d6a83cb5c71ae8895c1",
    measurementId: "G-5TTH12ZBVN"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const statusEl = document.getElementById("status");
  const sendBtn = document.getElementById("sendBtn");
  const checkBtn = document.getElementById("checkBtn");
  const logoutBtn = document.getElementById("logoutBtn");

  function setStatus(msg){ statusEl.textContent = msg; }

  onAuthStateChanged(auth, async (user) => {
    if(!user){
      window.location.href = "login.html";
      return;
    }

    await user.reload();

    if(user.emailVerified){
      setStatus("✅ Email verified! Redirecting...");
      setTimeout(()=> window.location.href = "/create-profile/", 700);
    } else {
      setStatus("❌ Email not verified yet. Click Send/Resend, then check your email.");
    }
  });

  sendBtn.onclick = async () => {
    const user = auth.currentUser;
    if(!user){ window.location.href="/login/"; return; }

    await user.reload();
    if(user.emailVerified){
      alert("Already verified ✅");
      window.location.href="/create-profile/";
      return;
    }

    try{
      await sendEmailVerification(user);
      alert("Verification email sent. Check Inbox/Spam.");
    }catch(e){
      alert(e.message);
    }
  };

  checkBtn.onclick = async () => {
    const user = auth.currentUser;
    if(!user) return;
    await user.reload();
    if(user.emailVerified){
      window.location.href = "/create-profile/";
    } else {
      alert("Still not verified. Click the link in your email, then come back.");
    }
  };

  logoutBtn.onclick = async () => {
    await signOut(auth);
    window.location.href = "/login/";
  };
</script>

</body>
</html>
