<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phone Verification</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
<style>
body{background:aliceblue;color:rgb(95, 91, 91);font-family:Poppins;display:flex;align-items:center;justify-content:center;height:100vh}
.box{background:white;padding:40px;border-radius:18px;width:90%;max-width:420px}
input,button{width:100%;padding:14px;border-radius:14px;border:none;margin-top:12px}
input{background:#1c1c22;color:#fff}
button{background:#7b61ff;color:#000;font-weight:600}
</style>
</head>
<body>

<div class="box">
<h2 style="text-align: center;">Verify Phone Number</h2>
<input id="phone" placeholder="+234..." />
<div id="recaptcha"></div>
<button onclick="sendOTP()">Send OTP</button>

<input id="otp" placeholder="Enter OTP" />
<button onclick="verifyOTP()">Verify</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app=initializeApp({ apiKey:"YOUR_KEY", authDomain:"YOUR_DOMAIN" });
const auth=getAuth(app);

window.recaptcha=new RecaptchaVerifier(auth,"recaptcha",{size:"invisible"});

let confirmation;

window.sendOTP=()=>{
 const phone=document.getElementById("phone").value;
 signInWithPhoneNumber(auth,phone,window.recaptcha)
 .then(res=>{confirmation=res;alert("OTP sent")});
};

window.verifyOTP=()=>{
 const code=document.getElementById("otp").value;
 confirmation.confirm(code).then(()=>{
  window.location="create-profile.html";
 });
};
</script>
</body>
</html>
